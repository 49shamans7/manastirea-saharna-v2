<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2688" viewBox="0 0 1440 2688">
  <title>Iconostasis grid — 12 col / 78px field / 24 gutter / 384 register</title>
  <rect width="1440" height="2688" fill="#f4efe4"/>
  <g fill="#c4a24a" opacity="0.18">
    <!-- 12 columns, 78 wide, 24 gutter, 120 margin -->
    <rect x="120"  width="78" height="2688"/><rect x="222"  width="78" height="2688"/>
    <rect x="324"  width="78" height="2688"/><rect x="426"  width="78" height="2688"/>
    <rect x="528"  width="78" height="2688"/><rect x="630"  width="78" height="2688"/>
    <rect x="732"  width="78" height="2688"/><rect x="834"  width="78" height="2688"/>
    <rect x="936"  width="78" height="2688"/><rect x="1038" width="78" height="2688"/>
    <rect x="1140" width="78" height="2688"/><rect x="1242" width="78" height="2688"/>
  </g>
  <!-- register boundaries: R1 is 2 registers (768), R2..R5 are 384 each -->
  <g stroke="#c4a24a" stroke-width="2">
    <line x1="0" y1="768"  x2="1440" y2="768"/>
    <line x1="0" y1="1152" x2="1440" y2="1152"/>
    <line x1="0" y1="1536" x2="1440" y2="1536"/>
    <line x1="0" y1="1920" x2="1440" y2="1920"/>
    <line x1="0" y1="2304" x2="1440" y2="2304"/>
  </g>
  <!-- Royal Doors axis: centre of R1-R2 -->
  <line x1="720" y1="0" x2="720" y2="1152" stroke="#c4a24a" stroke-width="3"/>
  <g font-family="Georgia,serif" font-size="15" fill="#807566" letter-spacing="2">
    <text x="24" y="60">R1 · LOCALE</text>
    <text x="24" y="812">R2 · DEESIS</text>
    <text x="24" y="1196">R3 · PRAZNICAR</text>
    <text x="24" y="1580">R4 · PROOROCI</text>
    <text x="24" y="1964">R5 · PATRIARHI</text>
  </g>
</svg>
