<!-- Quatrefoil: four equal circles (r = 6.5) centred 6.5 from the middle,
     so neighbouring lobes meet in four cusps at (16 ± 6.5, 16 ± 6.5) — the
     tracery foil of a Gothic window, the shape that sits in the head of the
     Moldavian lancets. Outline = currentColor; the heart is the seal's
     rhomb in its gold, which ties the Gothic figure to the folk band.
     Each arc joins two cusps that are a diameter apart, so each lobe is an
     exact semicircle. Square caps, mitred cusps; opaque. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"
    d="M22.5 9.5A6.5 6.5 0 0 1 22.5 22.5A6.5 6.5 0 0 1 9.5 22.5A6.5 6.5 0 0 1 9.5 9.5A6.5 6.5 0 0 1 22.5 9.5Z" />
  <path fill="#C9B07A" d="M16 11.5 20.5 16 16 20.5 11.5 16Z" />
</svg>
