<!-- Brâu: the twisted-rope belt that girdles a Moldavian church (Putna,
     Voroneț, Dragomirna). Repeat tile for background-repeat: repeat-x.
     Two fillets (the flat bands that hold the torus), and between them a
     rope of strands laid every 8 units. Strand at offset a:
       left flank   (a, 15.5) → (a+10, 4.5)   cubic, flat at both ends (an S)
       top cap      (a+10, 4.5) → (a+18, 4.5)  domed: the strand rolls away
       right flank  (a+18, 4.5) → (a+8, 15.5)  the left flank moved 8 right
       bottom cap   (a+8, 15.5) → (a, 15.5)    domed
     Neighbours share a flank, so the only ground that shows is a 1.25 S-line
     between strands and the V where two domes meet: that V is what makes it
     read as rope and not as laurel, down to 16px. Strands at a = -16…24 run
     over the edges and meet their own copies, so the repeat is seamless.
     Inks baked (a background cannot read currentColor): gold #AB9362 on deep
     #1A3346. Opaque only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 20" width="32" height="20">
  <rect width="32" height="20" fill="#1A3346" />
  <path fill="#AB9362" d="M0 0h32v1H0zM0 19h32v1H0z" />
  <g fill="#AB9362" stroke="#1A3346" stroke-width="1.25" stroke-linejoin="round">
    <path d="M-16 15.5C-13 15.5 -9 4.5 -6 4.5C-3.5 2 0.5 2.5 2 4.5C-1 4.5 -5 15.5 -8 15.5C-10.5 18 -14.5 17.5 -16 15.5Z" />
    <path d="M-8 15.5C-5 15.5 -1 4.5 2 4.5C4.5 2 8.5 2.5 10 4.5C7 4.5 3 15.5 0 15.5C-2.5 18 -6.5 17.5 -8 15.5Z" />
    <path d="M0 15.5C3 15.5 7 4.5 10 4.5C12.5 2 16.5 2.5 18 4.5C15 4.5 11 15.5 8 15.5C5.5 18 1.5 17.5 0 15.5Z" />
    <path d="M8 15.5C11 15.5 15 4.5 18 4.5C20.5 2 24.5 2.5 26 4.5C23 4.5 19 15.5 16 15.5C13.5 18 9.5 17.5 8 15.5Z" />
    <path d="M16 15.5C19 15.5 23 4.5 26 4.5C28.5 2 32.5 2.5 34 4.5C31 4.5 27 15.5 24 15.5C21.5 18 17.5 17.5 16 15.5Z" />
    <path d="M24 15.5C27 15.5 31 4.5 34 4.5C36.5 2 40.5 2.5 42 4.5C39 4.5 35 15.5 32 15.5C29.5 18 25.5 17.5 24 15.5Z" />
  </g>
</svg>
