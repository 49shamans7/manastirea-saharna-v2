                    fields:
                      - { name: time, label: "Ora (ex. 05.45)", widget: string, pattern: ['^\d{2}\.\d{2}$', "Scrieți ora așa: 05.45"] }
                      - { name: name, label: Slujba, widget: string }
                      - { name: nameEn, label: Slujba în engleză (opțional), widget: string, required: false }
                      - { name: nameRu, label: Slujba în rusă (opțional), widget: string, required: false }
